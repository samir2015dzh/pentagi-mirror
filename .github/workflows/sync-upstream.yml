name: Sync upstream mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror upstream branches and tags
        env:
          # Push with the SYNC_TOKEN PAT (needs the `workflow` scope), not the workflow's
          # own GITHUB_TOKEN: pushes whose trees create/update .github/workflows/* are
          # refused for tokens without that scope. Chunked by 40 refs per push.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e
          git clone --bare https://github.com/vxcontrol/pentagi.git upstream.git
          cd upstream.git
          MIRROR="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git for-each-ref --format='%(refname)' refs/heads refs/tags | sed 's/.*/+&:&/' | xargs -r -n 40 git push "$MIRROR"

      - name: Sync fork samir2015dzh/pentagi via merge-upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/samir2015dzh/pentagi/merge-upstream \
            -d '{"branch":"main"}')
          echo "HTTP ${status}"
          cat resp.json
          if [ "${status}" != "200" ]; then
            echo "merge-upstream failed for samir2015dzh/pentagi (main)"
            exit 1
          fi
